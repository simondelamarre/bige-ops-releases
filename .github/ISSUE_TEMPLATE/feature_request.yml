name: Feature request
description: Suggest an improvement for the desktop app or CLI
title: "[feat] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do that is hard or missing today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: How should it work?
    validations:
      required: false
  - type: textarea
    id: context
    attributes:
      label: Context
      description: Outscale region, OKS vs VMs, anything else useful.
    validations:
      required: false
